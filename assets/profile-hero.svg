      <text x="64" y="249" font-size="66" letter-spacing="-2" font-weight="750" fill="url(#accent)">Real execution.</text>
      <text x="67" y="294" font-size="20" fill="#d6ddf1">Software engineer · Open source contributor</text>
      <text x="67" y="328" font-size="17" fill="#9caac8">I build systems that turn conversation into action.</text>
      <text x="64" y="402" font-size="13" letter-spacing="2.1" font-weight="600" fill="#aab8d4">TYPESCRIPT / SWIFT / GO</text>
      <text x="1216" y="402" text-anchor="end" font-size="14" fill="#aab8d4">Build in public. Ship real things.</text>
