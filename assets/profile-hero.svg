<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="456" viewBox="0 0 1280 456" role="img" aria-labelledby="title desc">
  <title id="title">Awokoya Olawale Davidson — AI agents. Real execution.</title>
  <desc id="desc">A midnight blue banner with cyan and violet accents, an abstract network of connected tools, and the words Software engineer, Open source contributor, Lagos, open to remote.</desc>
